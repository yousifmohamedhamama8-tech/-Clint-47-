name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: yes | sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: unzip -q ./*.zip
      - run: cd Clint47 && gradle assembleOwnerDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Clint47-owner-apk
          path: Clint47/app/build/outputs/apk/owner/debug/*.apk

